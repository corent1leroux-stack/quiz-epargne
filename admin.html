.bar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.link.danger{color:var(--bad)}
.player{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

.actions{display:flex;gap:14px;flex-wrap:wrap}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:10px;border-radius:12px;background:var(--bg)}

.ok-msg{color:var(--ok);font-size:14px;font-weight:600}
.qstat .badge{align-self:flex-start}
.back{display:inline-block;margin-top:8px;font:600 13px var(--body);color:var(--accent);text-decoration:none}
nav button{position:relative;font-size:11px!important}
nav button .count{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--body);text-align:center}
.thread{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.thread:last-child{border-bottom:0}
.thread .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thread .q{font-weight:600}
.thread .a{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-line}
</style>

<script>
const L=["A","B","C","D"];
const $view=document.getElementById("view"), $who=document.getElementById("who"), $nav=document.getElementById("nav");
const S={props:null,forumView:"posts",pdrafts:{},forum:null,answering:null,confirmDel:null,pass:null,configured:null,data:null,tab:"suivi",week:null,edit:null,player:null,flash:null,error:null};

async function rpc(fn,args={}){
  const h={"Content-Type":"application/json",apikey:SUPABASE_KEY};
  if(!SUPABASE_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPABASE_KEY;
  let res;
  try{ res=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)}); }
  catch(e){ throw new Error("Pas de connexion. Vérifie ton réseau et réessaie."); }
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.message)||"Erreur du serveur.");
  if(data&&data.error) throw new Error(data.error);
  return data;
}
function el(tag,attrs={},...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(k==="value") e.value=v; else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); } return e; }
function fmt(iso){ return new Date(iso+(iso.length===10?"T12:00:00":"")).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function ago(ts){ if(!ts) return "jamais joué"; const d=Math.floor((Date.now()-new Date(ts))/864e5); return d<=0?"actif aujourd'hui":d===1?"actif hier":`actif il y a ${d} jours`; }
function pct(a,b){ return b?Math.round(100*a/b):null; }
function savePass(p){ try{ if(p){ localStorage.setItem("quiz-admin",p); localStorage.setItem("quiz-admin-device","1"); } else { localStorage.removeItem("quiz-admin"); localStorage.removeItem("quiz-admin-device"); } }catch(e){} }
function loadPass(){ try{ return localStorage.getItem("quiz-admin"); }catch(e){ return null; } }

function setTab(t){ S.tab=t; S.edit=null; S.player=null; S.flash=null; S.answering=null; S.confirmDel=null; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t)); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

async function refresh(){ S.forum=await rpc("admin_questions",{p_pass:S.pass}); S.props=await rpc("admin_proposals",{p_pass:S.pass}); S.data=await rpc("admin_overview",{p_pass:S.pass}); if(!S.week||!S.data.weeks.find(w=>w.id===S.week)) S.week=currentWeekId(); }
function currentWeekId(){ const t=S.data.today, ws=S.data.weeks; const cur=ws.filter(w=>w.start<=t&&t<=w.end).pop(); if(cur) return cur.id; const past=ws.filter(w=>w.start<=t).pop(); return (past||ws[0]||{}).id; }

function render(){
  $view.replaceChildren(); $who.replaceChildren();
  $nav.hidden=!S.data;
  if(S.error){ $view.append(el("div",{class:"notice"},S.error)); return; }
  if(S.configured===null){ $view.append(el("div",{class:"notice"},"Chargement…")); return; }
  if(!S.data) return renderLogin();
  $who.append(el("button",{onclick:logout},"Quitter le mode admin"));
  if(S.flash) $view.append(el("p",{class:"ok-msg",role:"status"},S.flash));
  ({suivi:renderSuivi,forum:renderForum,joueurs:renderPlayers,lots:renderPrizes,reglages:renderSettings})[S.tab]();
  updateCount();
}

/* ---------- Connexion / création du mot de passe ---------- */
function renderLogin(){
  const first=!S.configured;
  const pass=el("input",{id:"pass",type:"password",autocomplete:first?"new-password":"current-password",placeholder:"8 caractères minimum"});
  const pass2=first?el("input",{id:"pass2",type:"password",autocomplete:"new-password",placeholder:"Retape le mot de passe"}):null;
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},first?"Créer le mot de passe":"Entrer");
  $view.append(el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent="";
    if(first&&pass.value!==pass2.value){ err.textContent="Les deux mots de passe ne sont pas identiques."; return; }
    btn.disabled=true;
    try{
      if(first){ await rpc("admin_setup",{p_pass:pass.value}); S.configured=true; }
      S.pass=pass.value; await refresh(); savePass(S.pass); render();
    }catch(x){ err.textContent=x.message; btn.disabled=false; S.pass=null; }
  }},
    el("h2",{},first?"Crée ton accès administrateur":"Accès administrateur"),
    el("p",{class:"muted"},first?"Ce mot de passe protège le suivi, les joueurs et les questions. Choisis-le maintenant : une fois créé, personne d'autre ne pourra le définir.":"Entre ton mot de passe administrateur."),
    el("div",{class:"field"},el("label",{for:"pass"},"Mot de passe"),pass),
    first?el("div",{class:"field"},el("label",{for:"pass2"},"Confirmation"),pass2):null,
    err,btn));
}
function logout(){ S.pass=null; S.data=null; savePass(null); render(); }

/* ---------- Suivi : participation et statistiques par question ---------- */
function renderSuivi(){
  const d=S.data, w=d.weeks.find(x=>x.id===S.week);
  if(S.edit!==null&&w) return renderEdit(w);
  const t=d.today, played=d.players.filter(p=>p.weeks_played>0).length;
  $view.append(el("div",{class:"kpis"},
    el("div",{class:"kpi"},el("b",{},d.players.length),el("span",{},"inscrits")),
    el("div",{class:"kpi"},el("b",{},w?w.finished:0),el("span",{},"ont fini cette série")),
    el("div",{class:"kpi"},el("b",{},played),el("span",{},"ont déjà joué"))));
  const sel=el("select",{id:"week",onchange:e=>{S.week=e.target.value;render();}},
    d.weeks.map(x=>{ const o=el("option",{value:x.id},`${x.label} · ${x.theme}`+(x.start<=t&&t<=x.end?" (en cours)":x.start>t?" (à venir)":"")); if(x.id===S.week) o.selected=true; return o; }));
  $view.append(el("div",{class:"field"},el("label",{for:"week"},"Série"),sel));
  if(!w) return;
  const state=w.start>t?el("span",{class:"badge"},`Ouvre le ${fmt(w.start)}`):w.end<t?el("span",{class:"badge"},"Terminée"):el("span",{class:"badge live"},`En cours jusqu'au ${fmt(w.end)}`);
  const card=el("div",{class:"card"},
    el("div",{class:"week-head"},el("div",{},el("h3",{},w.label),el("h2",{},w.theme)),state),
    el("p",{class:"muted"},w.start>t?"Série pas encore ouverte : tu peux relire et corriger les questions.":`${w.started} joueur${w.started>1?"s ont":" a"} commencé, ${w.finished} ${w.finished>1?"ont":"a"} terminé.`+(w.counts?"":" Semaine d'essai, hors classement.")));
  w.questions.forEach((q,i)=>{
    const r=pct(q.ok,q.n), cls=r==null?"":r<50?"low":r<75?"mid":"high";
    card.append(el("div",{class:"qstat"},
      el("div",{class:"top"},el("strong",{},`${i+1}. ${q.q}`),el("span",{class:"rate "+cls},r==null?"—":r+" %")),
      el("span",{class:"badge"},FMT[q.type||"qcm"]),
      (q.type||"qcm")==="qcm"||q.type==="vf"?el("div",{class:"dist"},q.choices.map((c,k)=>{ const n=(q.dist||[])[k]||0; return el("div",{class:"bar"+(k===q.answer?" good":""),title:c},
        el("span",{},q.type==="vf"?c[0]:L[k]),el("div",{class:"track"},el("div",{class:"fill",style:`width:${q.n?Math.round(100*n/q.n):0}%`})),el("span",{class:"n"},n)); })):null,
      el("p",{class:"muted",style:"font-size:13px"},`Bonne réponse : ${goodAnswer(q)}`+(q.n?` · ${q.n} réponse${q.n>1?"s":""}`:"")),
      el("div",{},el("button",{class:"link",onclick:()=>{S.edit=i;S.flash=null;render();window.scrollTo(0,0);}},"Modifier la question"))));
  });
  $view.append(card);
  $view.append(el("p",{class:"muted",style:"font-size:13px"},"Le pourcentage indique la part de bonnes réponses. En rouge, moins de 50 % : un bon sujet à reprendre en atelier."));
}

const FMT={qcm:"QCM",vf:"Vrai ou faux",num:"Réponse à taper",multi:"Plusieurs réponses",order:"Classement"};
function goodAnswer(q){ const t=q.type||"qcm";
  if(t==="qcm") return `${L[q.answer]}. ${q.choices[q.answer]}`;
  if(t==="vf") return q.choices[q.answer];
  if(t==="num") return `${Number(q.answer_num).toLocaleString("fr-FR")} ${q.unit||""}`+(Number(q.tol)?` (à ${Number(q.tol).toLocaleString("fr-FR")} près)`:"");
  if(t==="multi") return (q.answer_json||[]).map(k=>q.choices[k]).join(" ; ");
  if(t==="order") return (q.answer_json||[]).map(k=>q.choices[k]).join(" → ");
  return ""; }
function renderEdit(w){
  const i=S.edit, q=w.questions[i];
  if(q.type&&q.type!=="qcm"&&q.type!=="vf") return renderEditText(w,i,q);
  const text=el("textarea",{id:"q-text",value:q.q});
  const choices=q.choices.map((c,k)=>el("input",{id:"q-c"+k,type:"text",value:c}));
  const radios=q.choices.map((c,k)=>{ const r=el("input",{type:"radio",name:"good",id:"q-r"+k,value:String(k)}); if(k===q.answer) r.checked=true; return r; });
  const explain=el("textarea",{id:"q-exp",value:q.explain||""}), tip=el("textarea",{id:"q-tip",value:q.tip||"",style:"min-height:60px"});
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Enregistrer");
  const answered=q.n>0;
  $view.append(el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent=""; btn.disabled=true;
    const ans=radios.findIndex(r=>r.checked);
    try{
      await rpc("admin_update_question",{p_pass:S.pass,p_week:w.id,p_q:i,p_text:text.value,p_choices:choices.map(c=>c.value),p_answer:ans,p_explain:explain.value,p_tip:tip.value});
      await refresh(); S.edit=null; S.flash="Question enregistrée."; render(); window.scrollTo(0,0);
    }catch(x){ err.textContent=x.message; btn.disabled=false; }
  }},
    el("button",{class:"link",type:"button",onclick:()=>{S.edit=null;render();}},"← Retour à la série"),
    el("h3",{},`${w.label} · question ${i+1}`),
    el("div",{class:"field"},el("label",{for:"q-text"},"Question"),text),
    el("div",{class:"field"},el("label",{},"Réponses (coche la bonne)"),
      choices.map((c,k)=>el("div",{class:"radio"},radios[k],el("span",{style:"font-weight:700;width:16px"},L[k]),c))),
    answered?el("p",{class:"notice"},`${q.n} joueur${q.n>1?"s ont":" a"} déjà répondu. Si tu changes la bonne réponse, leurs scores seront recalculés automatiquement.`):null,
    el("div",{class:"field"},el("label",{for:"q-exp"},"Explication"),explain),
    el("div",{class:"field"},el("label",{for:"q-tip"},"À retenir (facultatif)"),tip),
    err,btn));
}

// Pour les réponses à taper, multiples ou à classer : on modifie le texte et les explications
function renderEditText(w,i,q){
  const text=el("textarea",{value:q.q}), explain=el("textarea",{value:q.explain||""}), tip=el("textarea",{value:q.tip||"",style:"min-height:60px"});
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Enregistrer");
  $view.append(el("form",{class:"card",onsubmit:async e=>{ e.preventDefault(); err.textContent=""; btn.disabled=true;
    try{ await rpc("admin_update_question",{p_pass:S.pass,p_week:w.id,p_q:i,p_text:text.value,p_choices:null,p_answer:null,p_explain:explain.value,p_tip:tip.value});
      await refresh(); S.edit=null; S.flash="Question enregistrée."; render(); window.scrollTo(0,0); }
    catch(x){ err.textContent=x.message; btn.disabled=false; } }},
    el("button",{class:"link",type:"button",onclick:()=>{S.edit=null;render();}},"← Retour à la série"),
    el("h3",{},`${w.label} · question ${i+1} · ${FMT[q.type]}`),
    el("div",{class:"field"},el("label",{},"Question"),text),
    el("p",{class:"notice"},`Bonne réponse : ${goodAnswer(q)}. Pour ce format, la réponse elle-même ne se modifie pas ici : demande-moi si elle doit changer.`),
    el("div",{class:"field"},el("label",{},"Explication"),explain),
    el("div",{class:"field"},el("label",{},"À retenir (facultatif)"),tip),err,btn));
}

/* ---------- Questions des joueurs ---------- */
function updateCount(){ const b=document.querySelector('nav button[data-tab="forum"]'); if(!b) return; const old=b.querySelector(".count"); if(old) old.remove();
  const n=(S.forum||[]).filter(f=>f.kind==="question"&&!f.answer).length+(S.props||[]).filter(p=>p.status==="pending").length; if(n) b.append(el("span",{class:"count"},n)); }
function when(ts){ return new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}); }
const KINDS={question:"Question",lecture:"Lecture",video:"Vidéo",lien:"Lien"};
function renderForum(){
  const np=(S.props||[]).filter(p=>p.status==="pending").length, nq=(S.forum||[]).filter(f=>f.kind==="question"&&!f.answer).length;
  $view.append(el("div",{class:"seg"},[["posts",`Publications${nq?" ("+nq+")":""}`],["props",`Questions proposées${np?" ("+np+")":""}`]].map(([k,t])=>
    el("button",{"aria-selected":S.forumView===k?"true":"false",onclick:()=>{S.forumView=k;S.flash=null;render();}},t))));
  if(S.forumView==="props") return renderProposals();
  const list=S.forum||[], pending=list.filter(f=>f.kind==="question"&&!f.answer);
  const card=el("div",{class:"card"},el("h2",{},"Espace de partage"),
    el("p",{class:"muted"},pending.length?`${pending.length} question${pending.length>1?"s":""} en attente de réponse.`:"Toutes les questions ont une réponse."),
    el("p",{class:"muted",style:"font-size:13px"},"Tout est publié directement, et les joueurs peuvent se répondre entre eux. Ta réponse apparaît comme « Réponse de l'organisateur ». Tu peux masquer ou supprimer une publication ou une réponse."));
  if(!list.length) card.append(el("div",{class:"notice"},"Aucune publication pour l'instant."));
  list.forEach(f=>{
    const isQ=f.kind==="question";
    const t=el("div",{class:"thread"},
      el("div",{class:"meta"},el("span",{class:"badge"},KINDS[f.kind]||f.kind),el("strong",{},f.author||"Joueur supprimé"),when(f.created_at),
        f.hidden?el("span",{class:"badge warn"},"masquée"):null, isQ&&!f.answer?el("span",{class:"badge live"},"à répondre"):null, f.likes?el("span",{},`${f.likes} « utile »`):null),
      f.title?el("div",{class:"q"},f.title):null,
      f.url?el("a",{href:f.url,target:"_blank",rel:"noopener noreferrer",style:"color:var(--accent);font-size:13px;word-break:break-all"},f.url):null,
      f.body?el("div",{class:f.title?"":"q"},f.body):null,
      (f.comments&&f.comments.length)?el("div",{style:"display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:10px"},f.comments.map(c=>el("div",{style:"font-size:14px"},
        el("div",{class:"meta"},el("strong",{},c.author||"Joueur supprimé"),when(c.created_at),
          el("button",{class:"link danger",style:"font-size:12px",onclick:async()=>{ await rpc("admin_delete_comment",{p_pass:S.pass,p_id:c.id}); await refresh(); S.flash="Réponse supprimée."; render(); }},"Supprimer")),
        el("div",{},c.body)))):null);
    if(S.answering===f.id||(isQ&&!f.answer)){
      const box=el("textarea",{id:"ans-"+f.id,value:f.answer||"",placeholder:isQ?"Ta réponse, visible par tous les joueurs":"Ton commentaire, visible par tous (laisse vide pour le retirer)"}), err=el("p",{class:"error"});
      const save=el("button",{class:"btn small",onclick:async()=>{ err.textContent=""; save.disabled=true;
        try{ await rpc("admin_answer",{p_pass:S.pass,p_id:f.id,p_answer:box.value}); await refresh(); S.answering=null; S.flash=isQ?"Réponse publiée.":"Commentaire enregistré."; render(); }
        catch(x){ err.textContent=x.message; save.disabled=false; } }},isQ&&!f.answer?"Publier la réponse":"Enregistrer");
      t.append(box,el("div",{class:"actions"},save,(f.answer||!isQ)?el("button",{class:"link",onclick:()=>{S.answering=null;render();}},"Annuler"):null),err);
    } else if(f.answer){
      t.append(el("div",{class:"a"},f.answer));
    }
    const acts=el("div",{class:"actions"});
    if(S.answering!==f.id&&(f.answer||!isQ)) acts.append(el("button",{class:"link",onclick:()=>{S.answering=f.id;S.flash=null;render();}},isQ?"Modifier la réponse":(f.answer?"Modifier mon commentaire":"Ajouter un commentaire")));
    if(f.answer||!isQ) acts.append(el("button",{class:"link",onclick:async()=>{ await rpc("admin_hide_question",{p_pass:S.pass,p_id:f.id,p_hidden:!f.hidden}); await refresh(); S.flash=f.hidden?"Publication de nouveau visible.":"Publication masquée aux joueurs."; render(); }},f.hidden?"Afficher":"Masquer"));
    acts.append(el("button",{class:"link danger",onclick:()=>{S.confirmDel=f.id;render();}},"Supprimer"));
    t.append(acts);
    if(S.confirmDel===f.id) t.append(el("div",{class:"inline"},el("p",{style:"width:100%"},"Supprimer définitivement cette publication ?"),
      el("button",{class:"btn small danger",onclick:async()=>{ await rpc("admin_delete_question",{p_pass:S.pass,p_id:f.id}); await refresh(); S.confirmDel=null; S.flash="Publication supprimée."; render(); }},"Supprimer"),
      el("button",{class:"link",onclick:()=>{S.confirmDel=null;render();}},"Annuler")));
    card.append(t);
  });
  $view.append(card);
}


const PSTATUS={pending:"En attente",accepted:"Intégrée",rejected:"Refusée"};

  const list=S.props||[], t=S.data.today;

  const card=el("div",{class:"card"},el("h2",{},"Questions proposées"),
    el("p",{class:"muted",style:"font-size:13px"},"Corrige la question si besoin, puis choisis la série à venir et la question qu'elle remplace. Elle s'affichera avec le prénom de son auteur. Pense au niveau : les questions 1 à 3 sont faciles, 9 et 10 de niveau expert."));

    if(p.status!=="pending"){
      box.append(el("div",{class:"q"},p.q),

        p.status==="rejected"&&p.note?el("p",{class:"muted",style:"font-size:13px"},`Ton mot : ${p.note}`):null);
      card.append(box); return;
    }
    const k=p.kind||"qcm";
    const D=S.pdrafts[p.id]=S.pdrafts[p.id]||{q:p.q,choices:p.choices?[...p.choices]:[],answer:p.answer,good:p.answer_json?[...p.answer_json]:[],num:p.answer_num!=null?String(p.answer_num):"",tol:p.tol?String(p.tol):"",unit:p.unit||"",explain:p.explain||"",tip:p.tip||"",week:((future.find(w=>w.theme===p.theme)||future[0])||{}).id||"",pos:9,note:""};
    const q=el("textarea",{value:D.q,oninput:e=>D.q=e.target.value,"aria-label":"Question"});
    let opts=null;
    if(k==="qcm") opts=el("div",{class:"field"},el("label",{},"Réponses (coche la bonne)"),[0,1,2,3].map(i=>{ const r=el("input",{type:"radio",name:"good-"+p.id,"aria-label":`Réponse ${L[i]} correcte`,onchange:()=>D.answer=i}); if(D.answer===i) r.checked=true;
      return el("div",{class:"radio"},r,el("span",{style:"font-weight:700;width:16px"},L[i]),el("input",{type:"text",value:D.choices[i],oninput:e=>D.choices[i]=e.target.value,"aria-label":"Réponse "+L[i]})); }));
    if(k==="vf") opts=el("div",{class:"field"},el("label",{},"L'affirmation est"),el("div",{class:"radio"},
      ...[[0,"Vraie"],[1,"Fausse"]].map(([v,lab])=>{ const r=el("input",{type:"radio",name:"vf-"+p.id,"aria-label":lab,onchange:()=>D.answer=v}); if(D.answer===v) r.checked=true; return [r,el("span",{style:"margin-right:14px"},lab)]; }).flat()));
    if(k==="num") opts=el("div",{class:"field"},el("label",{},"Bonne réponse, unité et marge acceptée"),
      el("div",{class:"radio"},el("input",{type:"text",value:D.num,oninput:e=>D.num=e.target.value,"aria-label":"Bonne réponse"}),el("input",{type:"text",value:D.unit,style:"max-width:80px",oninput:e=>D.unit=e.target.value,"aria-label":"Unité"})),
      el("input",{type:"text",value:D.tol,placeholder:"Marge (0 = exact)",oninput:e=>D.tol=e.target.value,"aria-label":"Marge acceptée"}));
    if(k==="multi") opts=el("div",{class:"field"},el("label",{},"Réponses (coche toutes les bonnes)"),D.choices.map((c,i)=>el("div",{class:"radio"},
      el("input",{type:"checkbox",checked:D.good.includes(i),"aria-label":`Réponse ${i+1} correcte`,onchange:e=>{ const x=D.good.indexOf(i); e.target.checked?(x<0&&D.good.push(i)):(x>=0&&D.good.splice(x,1)); }}),
      el("input",{type:"text",value:c,oninput:e=>D.choices[i]=e.target.value,"aria-label":"Réponse "+(i+1)}))));
    if(k==="order") opts=el("div",{class:"field"},el("label",{},`Éléments dans le bon ordre${p.first?` (1 = ${p.first}, dernier = ${p.last||"…"})`:""}`),D.choices.map((c,i)=>el("div",{class:"radio"},
      el("span",{style:"font-weight:700;width:16px"},String(i+1)),el("input",{type:"text",value:c,oninput:e=>D.choices[i]=e.target.value,"aria-label":"Élément "+(i+1)}))),
      el("p",{class:"muted",style:"font-size:12px"},"Ils seront mélangés automatiquement à l'affichage."));
    const ex=el("textarea",{value:D.explain,placeholder:"Explication affichée après la réponse (obligatoire)",oninput:e=>D.explain=e.target.value,"aria-label":"Explication"});
    const tip=el("textarea",{value:D.tip,placeholder:"À retenir (facultatif)",style:"min-height:60px",oninput:e=>D.tip=e.target.value,"aria-label":"À retenir"});
    const wsel=el("select",{onchange:e=>{D.week=e.target.value;render();},"aria-label":"Série"},future.map(w=>{ const o=el("option",{value:w.id},`${w.label} · ${w.theme}`); if(w.id===D.week) o.selected=true; return o; }));
    const wk=future.find(w=>w.id===D.week);
    const psel=el("select",{onchange:e=>{D.pos=+e.target.value;render();},"aria-label":"Question remplacée"},(wk?wk.questions:[]).map((qq,i)=>{ const o=el("option",{value:String(i)},`Remplacer la question ${i+1}${qq.by?" (déjà proposée)":""} : ${qq.q.slice(0,60)}${qq.q.length>60?"…":""}`); if(i===D.pos) o.selected=true; return o; }));

      el("div",{class:"field"},el("label",{},"Explication"),ex),el("div",{class:"field"},el("label",{},"À retenir"),tip),
      future.length?el("div",{class:"field"},el("label",{},"Intégrer dans"),wsel,psel):el("div",{class:"notice"},"Plus aucune série à venir."),
      el("div",{class:"actions"},
        future.length?el("button",{class:"btn small",onclick:async()=>{ err.textContent="";
          const num=v=>{ const x=String(v).replace(/[\s\u00a0\u202f€%]/g,"").replace(",","."); return x===""||isNaN(+x)?null:+x; };
          try{ await rpc("admin_accept_proposal",{p_pass:S.pass,p_id:p.id,p_week:D.week,p_q:D.pos,p_text:D.q,
              p_choices:(k==="qcm"||k==="multi"||k==="order")?D.choices:null,p_answer:(k==="qcm"||k==="vf")?D.answer:null,p_explain:D.explain,p_tip:D.tip,
              p_answer_json:k==="multi"?[...D.good].sort((x,y)=>x-y):null,p_answer_num:k==="num"?num(D.num):null,p_tol:k==="num"?(num(D.tol)||0):null,p_unit:k==="num"?D.unit:null});
            delete S.pdrafts[p.id]; await refresh(); S.flash="Question intégrée au quiz."; render(); window.scrollTo(0,0); }catch(x){ err.textContent=x.message; } }},"Intégrer au quiz"):null),
      el("div",{class:"inline"},note,el("button",{class:"btn small danger",onclick:async()=>{ err.textContent="";
          try{ await rpc("admin_reject_proposal",{p_pass:S.pass,p_id:p.id,p_note:D.note}); delete S.pdrafts[p.id]; await refresh(); S.flash="Proposition refusée."; render(); }catch(x){ err.textContent=x.message; } }},"Refuser")),
      err);
    card.append(box);
  });
  $view.append(card);

/* ---------- Joueurs ---------- */
function renderPlayers(){
  const ps=S.data.players;
  const card=el("div",{class:"card"},el("h2",{},"Joueurs"),el("p",{class:"muted"},`${ps.length} inscrit${ps.length>1?"s":""}. Total des points sur toutes les semaines, essai compris.`));
  if(!ps.length) card.append(el("div",{class:"notice"},"Personne ne s'est encore inscrit."));
  ps.forEach(p=>{
    const row=el("div",{class:"player"},
      el("div",{style:"min-width:0"},el("strong",{},p.pseudo," ",p.locked?el("span",{class:"badge warn"},"bloqué 15 min"):null),
        el("div",{class:"muted",style:"font-size:13px"},`${p.points} pts · ${p.weeks_played} semaine${p.weeks_played>1?"s":""} · ${ago(p.last_seen)}`)),
      el("div",{class:"actions"},
        el("button",{class:"link",onclick:()=>{S.player={name:p.pseudo,mode:"pin"};S.flash=null;render();}},"Nouveau code"),
        el("button",{class:"link danger",onclick:()=>{S.player={name:p.pseudo,mode:"del"};S.flash=null;render();}},"Supprimer")));
    if(S.player&&S.player.name===p.pseudo) row.append(S.player.mode==="pin"?pinForm(p):deleteForm(p));
    card.append(row);
  });
  $view.append(card);
}
function pinForm(p){
  const pin=el("input",{id:"newpin",type:"text",inputmode:"numeric",maxlength:"4",placeholder:"4 chiffres"}), err=el("p",{class:"error"});
  return el("form",{class:"inline",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
    try{ await rpc("admin_reset_pin",{p_pass:S.pass,p_pseudo:p.pseudo,p_pin:pin.value.trim()}); await refresh(); S.player=null; S.flash=`Nouveau code de ${p.pseudo} : ${pin.value.trim()}. Transmets-le-lui.`; render(); }
    catch(x){ err.textContent=x.message; } }},
    el("label",{for:"newpin",style:"width:100%"},`Nouveau code pour ${p.pseudo}`),pin,el("button",{class:"btn small",type:"submit"},"Valider"),
    el("button",{class:"link",type:"button",onclick:()=>{S.player=null;render();}},"Annuler"),err);
}
function deleteForm(p){
  const err=el("p",{class:"error"});
  return el("div",{class:"inline"},el("p",{style:"width:100%"},`Supprimer ${p.pseudo} et toutes ses réponses ? C'est définitif.`),
    el("button",{class:"btn small danger",onclick:async()=>{ try{ await rpc("admin_delete_player",{p_pass:S.pass,p_pseudo:p.pseudo}); await refresh(); S.player=null; S.flash=`${p.pseudo} a été supprimé.`; render(); }catch(x){ err.textContent=x.message; } }},"Supprimer"),
    el("button",{class:"link",onclick:()=>{S.player=null;render();}},"Annuler"),err);
}

/* ---------- Lots ---------- */
function renderPrizes(){
  const P=S.data.prizes||{}, phases=[["season","Classement de la saison (28 mars)"]];
  const inputs={}, cur={};
  phases.forEach(([ph])=>{ cur[ph]={}; (P[ph]||[]).forEach(p=>cur[ph][p.rank]=p.label); inputs[ph]=[1,2,3].map(r=>el("input",{id:`prize-${ph}-${r}`,type:"text",maxlength:"120",value:cur[ph][r]||""})); });
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Enregistrer les lots");
  $view.append(el("form",{class:"card",onsubmit:async e=>{ e.preventDefault(); err.textContent=""; btn.disabled=true;
    try{ for(const [ph] of phases) for(let r=1;r<=3;r++){ const v=inputs[ph][r-1].value.trim(); if(v!==(cur[ph][r]||"")) await rpc("admin_set_prize",{p_pass:S.pass,p_phase:ph,p_rank:r,p_label:v}); }
      await refresh(); S.flash="Lots enregistrés. Ils s'affichent sous chaque classement."; render(); }
    catch(x){ err.textContent=x.message; btn.disabled=false; } }},
    el("h2",{},"Lots des podiums"),el("p",{class:"muted"},"Ils apparaissent pour tous les joueurs, sous le classement."),
    phases.map(([ph,title])=>el("div",{style:"display:flex;flex-direction:column;gap:10px"},el("h3",{},title),
      [1,2,3].map(r=>el("div",{class:"field"},el("label",{for:`prize-${ph}-${r}`},r===1?"1re place":`${r}e place`),inputs[ph][r-1])))),
    err,btn));
}

/* ---------- Réglages ---------- */
function renderSettings(){
  const cur=el("input",{id:"cur",type:"password",autocomplete:"current-password"}), nw=el("input",{id:"new",type:"password",autocomplete:"new-password",placeholder:"8 caractères minimum"});
  const err=el("p",{class:"error",role:"alert"});
  $view.append(el("form",{class:"card",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
    try{ await rpc("admin_change_password",{p_pass:cur.value,p_new:nw.value}); S.pass=nw.value; savePass(S.pass); S.flash="Mot de passe modifié."; render(); }
    catch(x){ err.textContent=x.message; } }},
    el("h2",{},"Changer le mot de passe"),
    el("div",{class:"field"},el("label",{for:"cur"},"Mot de passe actuel"),cur),
    el("div",{class:"field"},el("label",{for:"new"},"Nouveau mot de passe"),nw),err,el("button",{class:"btn",type:"submit"},"Modifier")));
}

/* ---------- Démarrage ---------- */
(async()=>{
  try{ S.configured=(await rpc("admin_status")).configured; }catch(e){ S.error=e.message; render(); return; }
  const p=loadPass();
  if(p&&S.configured){ try{ S.pass=p; await refresh(); savePass(p); }catch(e){ S.pass=null; savePass(null); } }
  render();
})();
</script>
