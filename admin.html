<script>
const L=["A","B","C","D"];
const $view=document.getElementById("view"), $who=document.getElementById("who"), $nav=document.getElementById("nav");
const S={pass:null,configured:null,data:null,tab:"suivi",week:null,edit:null,player:null,flash:null,error:null};

async function rpc(fn,args={}){
  const h={"Content-Type":"application/json",apikey:SUPABASE_KEY};
  if(!SUPABASE_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPABASE_KEY;
  let res;
  try{ res=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)}); }
  catch(e){ throw new Error("Pas de connexion. Vérifie ton réseau et réessaie."); }
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.message)||"Erreur du serveur.");
  if(data&&data.error) throw new Error(data.error);
  return data;
}
function el(tag,attrs={},...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(k==="value") e.value=v; else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); } return e; }
function fmt(iso){ return new Date(iso+(iso.length===10?"T12:00:00":"")).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function ago(ts){ if(!ts) return "jamais joué"; const d=Math.floor((Date.now()-new Date(ts))/864e5); return d<=0?"actif aujourd'hui":d===1?"actif hier":`actif il y a ${d} jours`; }
function pct(a,b){ return b?Math.round(100*a/b):null; }
function savePass(p){ try{ p?sessionStorage.setItem("quiz-admin",p):sessionStorage.removeItem("quiz-admin"); }catch(e){} }
function loadPass(){ try{ return sessionStorage.getItem("quiz-admin"); }catch(e){ return null; } }

function setTab(t){ S.tab=t; S.edit=null; S.player=null; S.flash=null; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t)); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

async function refresh(){ S.data=await rpc("admin_overview",{p_pass:S.pass}); if(!S.week||!S.data.weeks.find(w=>w.id===S.week)) S.week=currentWeekId(); }
function currentWeekId(){ const t=S.data.today, ws=S.data.weeks; const cur=ws.filter(w=>w.start<=t&&t<=w.end).pop(); if(cur) return cur.id; const past=ws.filter(w=>w.start<=t).pop(); return (past||ws[0]||{}).id; }

function render(){
  $view.replaceChildren(); $who.replaceChildren();
  $nav.hidden=!S.data;
  if(S.error){ $view.append(el("div",{class:"notice"},S.error)); return; }
  if(S.configured===null){ $view.append(el("div",{class:"notice"},"Chargement…")); return; }
  if(!S.data) return renderLogin();
  $who.append(el("button",{onclick:logout},"Se déconnecter"));
  if(S.flash) $view.append(el("p",{class:"ok-msg",role:"status"},S.flash));
  ({suivi:renderSuivi,joueurs:renderPlayers,lots:renderPrizes,reglages:renderSettings})[S.tab]();
}

/* ---------- Connexion / création du mot de passe ---------- */
function renderLogin(){
  const first=!S.configured;
  const pass=el("input",{id:"pass",type:"password",autocomplete:first?"new-password":"current-password",placeholder:"8 caractères minimum"});
  const pass2=first?el("input",{id:"pass2",type:"password",autocomplete:"new-password",placeholder:"Retape le mot de passe"}):null;
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},first?"Créer le mot de passe":"Entrer");
  $view.append(el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent="";
    if(first&&pass.value!==pass2.value){ err.textContent="Les deux mots de passe ne sont pas identiques."; return; }
    btn.disabled=true;
    try{
      if(first){ await rpc("admin_setup",{p_pass:pass.value}); S.configured=true; }
      S.pass=pass.value; await refresh(); savePass(S.pass); render();
    }catch(x){ err.textContent=x.message; btn.disabled=false; S.pass=null; }
  }},
    el("h2",{},first?"Crée ton accès administrateur":"Accès administrateur"),
    el("p",{class:"muted"},first?"Ce mot de passe protège le suivi, les joueurs et les questions. Choisis-le maintenant : une fois créé, personne d'autre ne pourra le définir.":"Entre ton mot de passe administrateur."),
    el("div",{class:"field"},el("label",{for:"pass"},"Mot de passe"),pass),
    first?el("div",{class:"field"},el("label",{for:"pass2"},"Confirmation"),pass2):null,
    err,btn));
}
function logout(){ S.pass=null; S.data=null; savePass(null); render(); }

/* ---------- Suivi : participation et statistiques par question ---------- */
function renderSuivi(){
  const d=S.data, w=d.weeks.find(x=>x.id===S.week);
  if(S.edit!==null&&w) return renderEdit(w);
  const t=d.today, played=d.players.filter(p=>p.weeks_played>0).length;
  $view.append(el("div",{class:"kpis"},
    el("div",{class:"kpi"},el("b",{},d.players.length),el("span",{},"inscrits")),
    el("div",{class:"kpi"},el("b",{},w?w.finished:0),el("span",{},"ont fini cette série")),
    el("div",{class:"kpi"},el("b",{},played),el("span",{},"ont déjà joué"))));
  const sel=el("select",{id:"week",onchange:e=>{S.week=e.target.value;render();}},
    d.weeks.map(x=>{ const o=el("option",{value:x.id},`${x.label} · ${x.theme}`+(x.start<=t&&t<=x.end?" (en cours)":x.start>t?" (à venir)":"")); if(x.id===S.week) o.selected=true; return o; }));
  $view.append(el("div",{class:"field"},el("label",{for:"week"},"Série"),sel));
  if(!w) return;
  const state=w.start>t?el("span",{class:"badge"},`Ouvre le ${fmt(w.start)}`):w.end<t?el("span",{class:"badge"},"Terminée"):el("span",{class:"badge live"},`En cours jusqu'au ${fmt(w.end)}`);
  const card=el("div",{class:"card"},
    el("div",{class:"week-head"},el("div",{},el("h3",{},w.label),el("h2",{},w.theme)),state),
    el("p",{class:"muted"},w.start>t?"Série pas encore ouverte : tu peux relire et corriger les questions.":`${w.started} joueur${w.started>1?"s ont":" a"} commencé, ${w.finished} ${w.finished>1?"ont":"a"} terminé.`+(w.counts?"":" Semaine d'essai, hors classement.")));
  w.questions.forEach((q,i)=>{
    const r=pct(q.ok,q.n), cls=r==null?"":r<50?"low":r<75?"mid":"high";
    card.append(el("div",{class:"qstat"},
      el("div",{class:"top"},el("strong",{},`${i+1}. ${q.q}`),el("span",{class:"rate "+cls},r==null?"—":r+" %")),
      el("div",{class:"dist"},q.choices.map((c,k)=>{ const n=(q.dist||[])[k]||0; return el("div",{class:"bar"+(k===q.answer?" good":""),title:c},
        el("span",{},L[k]),el("div",{class:"track"},el("div",{class:"fill",style:`width:${q.n?Math.round(100*n/q.n):0}%`})),el("span",{class:"n"},n)); })),
      el("p",{class:"muted",style:"font-size:13px"},`Bonne réponse : ${L[q.answer]}. ${q.choices[q.answer]}`+(q.n?` · ${q.n} réponse${q.n>1?"s":""}`:"")),
      el("div",{},el("button",{class:"link",onclick:()=>{S.edit=i;S.flash=null;render();window.scrollTo(0,0);}},"Modifier la question"))));
  });
  $view.append(card);
  $view.append(el("p",{class:"muted",style:"font-size:13px"},"Le pourcentage indique la part de bonnes réponses. En rouge, moins de 50 % : un bon sujet à reprendre en atelier."));
}

function renderEdit(w){
  const i=S.edit, q=w.questions[i];
  const text=el("textarea",{id:"q-text",value:q.q});
  const choices=q.choices.map((c,k)=>el("input",{id:"q-c"+k,type:"text",value:c}));
  const radios=q.choices.map((c,k)=>{ const r=el("input",{type:"radio",name:"good",id:"q-r"+k,value:String(k)}); if(k===q.answer) r.checked=true; return r; });
  const explain=el("textarea",{id:"q-exp",value:q.explain||""}), tip=el("textarea",{id:"q-tip",value:q.tip||"",style:"min-height:60px"});
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Enregistrer");
  const answered=q.n>0;
  $view.append(el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent=""; btn.disabled=true;
    const ans=radios.findIndex(r=>r.checked);
    try{
      await rpc("admin_update_question",{p_pass:S.pass,p_week:w.id,p_q:i,p_text:text.value,p_choices:choices.map(c=>c.value),p_answer:ans,p_explain:explain.value,p_tip:tip.value});
      await refresh(); S.edit=null; S.flash="Question enregistrée."; render(); window.scrollTo(0,0);
    }catch(x){ err.textContent=x.message; btn.disabled=false; }
  }},
    el("button",{class:"link",type:"button",onclick:()=>{S.edit=null;render();}},"← Retour à la série"),
    el("h3",{},`${w.label} · question ${i+1}`),
    el("div",{class:"field"},el("label",{for:"q-text"},"Question"),text),
    el("div",{class:"field"},el("label",{},"Réponses (coche la bonne)"),
      choices.map((c,k)=>el("div",{class:"radio"},radios[k],el("span",{style:"font-weight:700;width:16px"},L[k]),c))),
    answered?el("p",{class:"notice"},`${q.n} joueur${q.n>1?"s ont":" a"} déjà répondu. Si tu changes la bonne réponse, leurs scores seront recalculés automatiquement.`):null,
    el("div",{class:"field"},el("label",{for:"q-exp"},"Explication"),explain),
    el("div",{class:"field"},el("label",{for:"q-tip"},"À retenir (facultatif)"),tip),
    err,btn));
}

/* ---------- Joueurs ---------- */
function renderPlayers(){
  const ps=S.data.players;
  const card=el("div",{class:"card"},el("h2",{},"Joueurs"),el("p",{class:"muted"},`${ps.length} inscrit${ps.length>1?"s":""}. Total des points sur toutes les semaines, essai compris.`));
  if(!ps.length) card.append(el("div",{class:"notice"},"Personne ne s'est encore inscrit."));
  ps.forEach(p=>{
    const row=el("div",{class:"player"},
      el("div",{style:"min-width:0"},el("strong",{},p.pseudo," ",p.locked?el("span",{class:"badge warn"},"bloqué 15 min"):null),
        el("div",{class:"muted",style:"font-size:13px"},`${p.points} pts · ${p.weeks_played} semaine${p.weeks_played>1?"s":""} · ${ago(p.last_seen)}`)),
      el("div",{class:"actions"},
        el("button",{class:"link",onclick:()=>{S.player={name:p.pseudo,mode:"pin"};S.flash=null;render();}},"Nouveau code"),
        el("button",{class:"link danger",onclick:()=>{S.player={name:p.pseudo,mode:"del"};S.flash=null;render();}},"Supprimer")));
    if(S.player&&S.player.name===p.pseudo) row.append(S.player.mode==="pin"?pinForm(p):deleteForm(p));
    card.append(row);
  });
  $view.append(card);
}
function pinForm(p){
  const pin=el("input",{id:"newpin",type:"text",inputmode:"numeric",maxlength:"4",placeholder:"4 chiffres"}), err=el("p",{class:"error"});
  return el("form",{class:"inline",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
    try{ await rpc("admin_reset_pin",{p_pass:S.pass,p_pseudo:p.pseudo,p_pin:pin.value.trim()}); await refresh(); S.player=null; S.flash=`Nouveau code de ${p.pseudo} : ${pin.value.trim()}. Transmets-le-lui.`; render(); }
    catch(x){ err.textContent=x.message; } }},
    el("label",{for:"newpin",style:"width:100%"},`Nouveau code pour ${p.pseudo}`),pin,el("button",{class:"btn small",type:"submit"},"Valider"),
    el("button",{class:"link",type:"button",onclick:()=>{S.player=null;render();}},"Annuler"),err);
}
function deleteForm(p){
  const err=el("p",{class:"error"});
  return el("div",{class:"inline"},el("p",{style:"width:100%"},`Supprimer ${p.pseudo} et toutes ses réponses ? C'est définitif.`),
    el("button",{class:"btn small danger",onclick:async()=>{ try{ await rpc("admin_delete_player",{p_pass:S.pass,p_pseudo:p.pseudo}); await refresh(); S.player=null; S.flash=`${p.pseudo} a été supprimé.`; render(); }catch(x){ err.textContent=x.message; } }},"Supprimer"),
    el("button",{class:"link",onclick:()=>{S.player=null;render();}},"Annuler"),err);
}

/* ---------- Lots ---------- */
function renderPrizes(){
  const cur={}; (S.data.prizes||[]).forEach(p=>cur[p.rank]=p.label);
  const inputs=[1,2,3].map(r=>el("input",{id:"prize"+r,type:"text",maxlength:"120",value:cur[r]||""}));
  const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Enregistrer les lots");
  $view.append(el("form",{class:"card",onsubmit:async e=>{ e.preventDefault(); err.textContent=""; btn.disabled=true;
    try{ for(let r=1;r<=3;r++){ const v=inputs[r-1].value.trim(); if(v!==(cur[r]||"")) await rpc("admin_set_prize",{p_pass:S.pass,p_rank:r,p_label:v}); }
      await refresh(); S.flash="Lots enregistrés. Ils s'affichent sous le classement."; render(); }
    catch(x){ err.textContent=x.message; btn.disabled=false; } }},
    el("h2",{},"Lots du podium"),el("p",{class:"muted"},"Ils apparaissent pour tous les joueurs, sous le classement général."),
    [1,2,3].map(r=>el("div",{class:"field"},el("label",{for:"prize"+r},r===1?"1re place":`${r}e place`),inputs[r-1])),err,btn));
}

/* ---------- Réglages ---------- */
function renderSettings(){
  const cur=el("input",{id:"cur",type:"password",autocomplete:"current-password"}), nw=el("input",{id:"new",type:"password",autocomplete:"new-password",placeholder:"8 caractères minimum"});
  const err=el("p",{class:"error",role:"alert"});
  $view.append(el("form",{class:"card",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
    try{ await rpc("admin_change_password",{p_pass:cur.value,p_new:nw.value}); S.pass=nw.value; savePass(S.pass); S.flash="Mot de passe modifié."; render(); }
    catch(x){ err.textContent=x.message; } }},
    el("h2",{},"Changer le mot de passe"),
    el("div",{class:"field"},el("label",{for:"cur"},"Mot de passe actuel"),cur),
    el("div",{class:"field"},el("label",{for:"new"},"Nouveau mot de passe"),nw),err,el("button",{class:"btn",type:"submit"},"Modifier")));
}

/* ---------- Démarrage ---------- */
(async()=>{
  try{ S.configured=(await rpc("admin_status")).configured; }catch(e){ S.error=e.message; render(); return; }
  const p=loadPass();
  if(p&&S.configured){ try{ S.pass=p; await refresh(); }catch(e){ S.pass=null; savePass(null); } }
  render();
})();
</script>
</body>
</html>
