/* ---------- Accès à la base (fonctions Supabase) ---------- */
async function rpc(fn,args={}){
  const h={"Content-Type":"application/json",apikey:SUPABASE_KEY};
  if(!SUPABASE_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPABASE_KEY;
  let res;
  try{ res=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)}); }
  catch(e){ throw new Error("Pas de connexion. Vérifie ton réseau et réessaie."); }
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.message)||"Erreur du serveur.");
  if(data&&data.error) throw new Error(data.error);
  return data;
}

function setTab(t){ S.tab=t; S.review=null; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t)); render(); window.scrollTo(0,0); if(t==="board") loadBoard(); if(t==="archive") loadArchives(); if(t==="forum") loadForum(); }

   Pour y accéder la première fois : toucher 5 fois de suite le titre « Quiz Épargne ». */
(function(){
  let admin=false; try{ admin=localStorage.getItem("quiz-admin-device")==="1"; }catch(e){}
  if(admin){
    document.querySelector("nav .tabs").style.gridTemplateColumns="repeat(5,1fr)";
    document.querySelector("nav .tabs").append(el("button",{role:"tab","aria-selected":"false",onclick:()=>{ location.href="admin.html"; }},
      (()=>{ const t=document.createElement("template"); t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>'; return t.content.firstChild; })(),"Admin"));
  }
  let taps=0, timer=null;
  document.querySelector(".brand").addEventListener("click",()=>{ taps++; clearTimeout(timer); timer=setTimeout(()=>taps=0,2500); if(taps>=5){ location.href="admin.html"; } });
})();

function render(){
  $view.replaceChildren();
  $who.replaceChildren();
  if(S.auth){ $who.append(el("div",{},S.auth.pseudo),el("button",{onclick:logout},"Changer de joueur")); }
  $nav.hidden=!S.auth;
  if(S.error){ $view.append(el("div",{class:"notice"},S.error),el("button",{class:"btn ghost",onclick:()=>{S.error=null;start();}},"Réessayer")); return; }
  if(!S.auth) return renderLogin();
  if(S.tab==="quiz") renderQuiz(); else if(S.tab==="board") renderBoard(); else if(S.tab==="forum") renderForum(); else renderArchive();
  updateDot();
}

/* ---------- Connexion ---------- */
function renderLogin(){
  const name=el("input",{id:"pseudo",type:"text",maxlength:"30",autocomplete:"username",placeholder:"Ex. Corentin"});
  const pin=el("input",{id:"pin",type:"password",inputmode:"numeric",pattern:"[0-9]*",maxlength:"4",autocomplete:"current-password",placeholder:"4 chiffres"});
  const err=el("p",{class:"error",role:"alert"});
  const btn=el("button",{class:"btn",type:"submit"},"Entrer");
  const form=el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent="";
    const p=name.value.trim(), c=pin.value.trim();
    if(p.length<2){ err.textContent="Indique ton prénom."; return; }
    if(!/^\d{4}$/.test(c)){ err.textContent="Le code doit contenir 4 chiffres."; return; }
    btn.disabled=true; btn.textContent="Connexion…";
    try{ const r=await rpc("join_quiz",{p_pseudo:p,p_pin:c}); S.auth={pseudo:r.pseudo,pin:c}; saveAuth(S.auth); await loadWeek(); loadBadges(); render(); }
    catch(x){ err.textContent=x.message; btn.disabled=false; btn.textContent="Entrer"; }
  }},
    el("h2",{},"Bienvenue dans le quiz"),
    el("p",{},"Chaque semaine, 5 questions sur l'épargne et les placements. Un point par bonne réponse, et un classement général en fin d'année."),
    el("div",{class:"field"},el("label",{for:"pseudo"},"Ton prénom"),name),
    el("div",{class:"field"},el("label",{for:"pin"},"Ton code secret"),pin),
    el("p",{class:"muted",style:"font-size:13px"},"Première fois ? Choisis un code à 4 chiffres et retiens-le : il te servira pour te reconnecter sur un autre appareil."),
    err,btn);
  $view.append(form);
}
function logout(){ stopTimer(); S.cur=null; S.badges=null; S.auth=null; saveAuth(null); S.mine=[]; S.qIndex=null; S.tab="quiz"; render(); }

/* ---------- Semaine en cours ---------- */
async function loadWeek(){
  S.week=await rpc("current_week");
  if(!S.week){ S.nextStart=await rpc("next_week_start"); S.mine=[]; S.pending=null; return; }
  const r=await rpc("my_week",{...cred(),p_week:S.week.id});
  S.mine=r.answers||[]; S.pending=r.pending?r.pending.q:null;
}
let timerId=null;

function remaining(){ return S.cur? Math.max(0,S.cur.limit-(Date.now()-S.cur.t0)/1000) : 0; }
function tick(){
  const r=remaining(), bar=document.getElementById("tbar"), txt=document.getElementById("tsec");
  if(bar){ bar.style.width=(100*r/S.cur.limit)+"%"; bar.classList.toggle("hurry",r<=10); }
  if(txt) txt.textContent=Math.ceil(r)+" s";
  if(r<=0&&!S.busy){ stopTimer(); answer(S.cur.q,-1); }
}
async function startQ(i){
  if(S.busy) return; S.busy=true; render();
  try{ const r=await rpc("start_question",{...cred(),p_week:S.week.id,p_q:i});
    S.cur={...r,t0:Date.now()-r.elapsed*1000}; S.pending=i; S.qIndex=null;
    stopTimer(); timerId=setInterval(tick,250);
  }catch(e){ S.flash=e.message; }
  S.busy=false; render(); tick();
}

async function answer(i,k){

  try{ const r=await rpc("submit_answer",{...cred(),p_week:S.week.id,p_q:i,p_choice:k}); S.mine[i]=r; S.qIndex=i; S.cur=null; S.pending=null; loadBadges(); }

/* ---------- Classement ---------- */

    if(!S.prizes) S.prizes=await rpc("prizes_list");
    if(!S.phase) S.phase="season";
    S.boards=S.boards||{}; S.boards[S.phase]=await rpc("leaderboard",{p_phase:S.phase});
  }catch(e){ S.boards={error:e.message}; }
  if(S.tab==="board") render();
}

/* ---------- Archives et corrections ---------- */

function renderArchive(){
  if(S.review){

    el("div",{class:"archive"},el("div",{style:"min-width:0"},el("strong",{},`${w.label} · ${w.theme}`),

          c.mine?el("button",{class:"ghost-sm danger",onclick:async()=>{ try{ await rpc("delete_my_comment",{...cred(),p_id:c.id}); await loadForum(); }catch(e){} }},"Supprimer"):null),
        el("div",{},c.body)))):null,

      el("div",{class:"post-actions"},
        el("button",{class:"like"+(f.liked?" on":""),"aria-pressed":f.liked?"true":"false",onclick:async()=>{ try{ const r=await rpc("toggle_like",{...cred(),p_id:f.id}); f.liked=!f.liked; f.likes=r.likes; loadBadges(); render(); }catch(e){} }},icon("thumb"),`Utile${f.likes?" · "+f.likes:""}`),

}

function icon(name){ const t=document.createElement("template"); t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.star)+'</svg>'; return t.content.firstChild; }
const unlocked=b=>b.progress>=b.target;
async function loadBadges(){ try{ const list=await rpc("my_badges",cred()); const before=S.badges; S.badges=list;
    if(before){ const old=new Set(before.filter(unlocked).map(b=>b.id)); const fresh=list.filter(b=>unlocked(b)&&!old.has(b.id)); if(fresh.length) toast(fresh[0]); }
  }catch(e){} }
function toast(b){ const t=el("div",{class:"toast",role:"status"},el("div",{class:"medal"},icon(b.icon)),el("div",{},el("b",{},"Badge débloqué"),b.name));
  document.body.append(t); setTimeout(()=>t.remove(),4500); }
function badgeButton(b){ const on=unlocked(b);
  return el("button",{class:`bdg t${b.tier}${on?"":" locked"}`,"aria-label":`${b.name}${on?", débloqué":", verrouillé"}`,onclick:()=>{S.badgeOpen=S.badgeOpen===b.id?null:b.id;render();}},
    el("div",{class:"medal"},icon(b.icon)),el("div",{class:"nm"},b.name),
    on?null:el("div",{class:"pg"},el("i",{style:`width:${Math.round(100*b.progress/b.target)}%`}))); }
function renderBadges(){
  const list=S.badges; if(!list) return;
  const n=list.filter(unlocked).length, open=list.find(b=>b.id===S.badgeOpen);
  const cats=[...new Set(list.map(b=>b.cat||"Badges"))];
  $view.append(el("div",{class:"card"},el("div",{class:"week-head"},el("h2",{},"Mes badges"),el("span",{class:"pill"},`${n} / ${list.length}`)),
    !S.allBadges?el("div",{class:"badges"},list.filter(unlocked).map(badgeButton)):null,
    !S.allBadges&&!n?el("p",{class:"muted"},"Aucun badge pour l'instant : réponds à ta première question pour débloquer le premier."):null,
    el("button",{class:"btn ghost",onclick:()=>{S.allBadges=!S.allBadges;S.badgeOpen=null;render();}},S.allBadges?"Masquer les badges à débloquer":`Voir les ${list.length} badges et comment les débloquer`),
    open?el("div",{class:"bdg-detail"},el("strong",{},open.name),el("p",{},open.desc+(unlocked(open)?" : débloqué.":` (${open.progress} / ${open.target}).`))):null,
    !S.allBadges?null:cats.map(c=>{ const items=list.filter(b=>(b.cat||"Badges")===c); return el("div",{class:"bcat"},
      el("h3",{},`${c} · ${items.filter(unlocked).length}/${items.length}`),el("div",{class:"badges"},items.map(badgeButton))); })));
}

/* ---------- Proposer une question ---------- */
async function loadProposals(){
  try{ const [mine,themes]=await Promise.all([rpc("my_proposals",cred()),rpc("future_themes")]); S.proposals=mine; S.themes=themes; }
  catch(e){ S.proposals={error:e.message}; }
  if(S.tab==="archive"&&!S.review) render();
}
const PSTATUS={pending:"En attente",accepted:"Retenue",rejected:"Non retenue"};
function renderPropose(){
  const P=S.pdraft=S.pdraft||{theme:"",q:"",choices:["","","",""],answer:null,explain:"",tip:""};
  const card=el("div",{class:"card propose"},el("h2",{},"Propose ta question"),
    el("p",{class:"muted"},"Une question qui t'a fait réfléchir, un piège fréquent en rendez-vous ? Propose-la : si elle est retenue, elle sera jouée par toute l'agence avec ton prénom."));
  if(!S.proposeOpen){
    card.append(el("button",{class:"btn",onclick:()=>{S.proposeOpen=true;render();}},"Proposer une question"));
  } else {
    const theme=el("select",{id:"pp-theme",onchange:e=>P.theme=e.target.value},el("option",{value:""},"Thème libre"),
      (Array.isArray(S.themes)?S.themes:[]).map(t=>{ const o=el("option",{value:t.theme},`${t.theme} (à partir du ${fmt(t.start)})`); if(P.theme===t.theme) o.selected=true; return o; }));
    const q=el("textarea",{id:"pp-q",maxlength:"400",placeholder:"Ex. Quel est le plafond du PEA jeune ?",value:P.q,oninput:e=>P.q=e.target.value});
    const opts=[0,1,2,3].map(k=>{ const r=el("input",{type:"radio",name:"pp-good",id:"pp-r"+k,"aria-label":`Réponse ${L[k]} correcte`,onchange:()=>P.answer=k}); if(P.answer===k) r.checked=true;
      return el("div",{class:"opt"},r,el("b",{},L[k]),el("input",{type:"text",id:"pp-c"+k,maxlength:"200",placeholder:k===0?"Réponse":"Autre réponse",value:P.choices[k],oninput:e=>P.choices[k]=e.target.value})); });
    const ex=el("textarea",{id:"pp-ex",maxlength:"1000",placeholder:"Pourquoi c'est la bonne réponse (facultatif, mais très apprécié)",value:P.explain,oninput:e=>P.explain=e.target.value});
    const err=el("p",{class:"error",role:"alert"}), btn=el("button",{class:"btn",type:"submit"},"Envoyer ma proposition");
    card.append(el("form",{style:"display:flex;flex-direction:column;gap:14px",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
        if(P.answer===null){ err.textContent="Coche la bonne réponse."; return; }
        btn.disabled=true;
        try{ await rpc("propose_question",{...cred(),p_theme:P.theme,p_q:P.q,p_choices:P.choices,p_answer:P.answer,p_explain:P.explain,p_tip:""});
          S.pdraft=null; S.proposeOpen=false; S.flash="Merci ! Ta proposition est envoyée : tu verras ici si elle est retenue."; await loadProposals(); loadBadges(); }
        catch(x){ err.textContent=x.message; btn.disabled=false; } }},
      el("div",{class:"field"},el("label",{for:"pp-theme"},"Thème"),theme),
      el("div",{class:"field"},el("label",{for:"pp-q"},"Question"),q),
      el("div",{class:"field"},el("label",{},"Les 4 réponses (coche la bonne)"),opts),
      el("div",{class:"field"},el("label",{for:"pp-ex"},"Explication"),ex),
      err,btn,el("button",{class:"btn ghost",type:"button",onclick:()=>{S.proposeOpen=false;render();}},"Annuler")));
  }
  if(S.flash){ card.append(el("p",{class:"okmsg"},S.flash)); S.flash=null; }
  const list=Array.isArray(S.proposals)?S.proposals:[];
  if(list.length) card.append(el("h3",{},"Mes propositions"),el("div",{},list.map(p=>el("div",{class:"prop"},
    el("span",{class:"status "+p.status},PSTATUS[p.status]),
    el("strong",{},p.q),
    p.status==="accepted"?el("p",{class:"muted",style:"font-size:13px"},`Au programme de la ${p.week} (${p.week_theme}), à partir du ${fmt(p.week_start)}.`):null,
    p.status==="rejected"&&p.note?el("p",{class:"muted",style:"font-size:13px"},`Le mot de l'organisateur : ${p.note}`):null,
    p.status==="pending"?el("button",{class:"ghost-sm danger",style:"align-self:flex-start",onclick:async()=>{ try{ await rpc("withdraw_proposal",{...cred(),p_id:p.id}); await loadProposals(); }catch(e){} }},"Retirer"):null))));
  $view.append(card);
}

/* ---------- Démarrage ---------- */
async function start(){
  if(SUPABASE_URL.includes("VOTRE-PROJET")){ S.error="L'appli n'est pas encore reliée à sa base de données : renseigne SUPABASE_URL et SUPABASE_KEY en haut du fichier."; render(); return; }
  S.auth=loadAuth();
  checkForum();
  if(S.auth){ try{ await loadWeek(); loadBadges(); }catch(e){ if(/Code|Prénom|essais/.test(e.message)){ S.auth=null; saveAuth(null); } else S.error=e.message; } }
  render();
}
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible"&&S.auth&&!S.busy&&S.qIndex===null){ try{ await loadWeek(); render(); }catch(e){} } });
start();
</script>
