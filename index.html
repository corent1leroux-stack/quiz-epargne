<style>

.rank{font:800 18px var(--display);font-variant-numeric:tabular-nums;text-align:center;color:var(--muted)}

.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted)}
.row .pts{font:800 20px var(--display);font-variant-numeric:tabular-nums;text-align:right}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}

.step.s1 .block{height:84px;background:var(--gold);color:#fff} .step.s2 .block{height:62px} .step.s3 .block{height:46px}
.archive{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

<body>
<div class="app">
  <header>
    <div class="brand">Quiz Épargne<small>5 questions par semaine</small></div>
    <div class="who" id="who"></div>
  </header>
  <main id="view"><div class="notice">Chargement…</div></main>
</div>
<nav id="nav" hidden><div class="tabs" role="tablist">
  <button role="tab" data-tab="quiz" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>Cette semaine</button>
  <button role="tab" data-tab="board" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V12h4v8M10 20V6h4v14M16 20v-5h4v5"/></svg>Classement</button>
  <button role="tab" data-tab="forum" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 10a2.5 2.5 0 1 1 3 2.4c-.5.2-.5.6-.5 1.1"/><circle cx="12" cy="16" r=".5" fill="currentColor"/></svg>Questions</button>
  <button role="tab" data-tab="archive" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>Parcours</button>
</div></nav>

<script>
const L=["A","B","C","D"];
const $view=document.getElementById("view"), $who=document.getElementById("who"), $nav=document.getElementById("nav");
const S={badges:null,badgeOpen:null,forum:null,forumSeen:0,prizes:null,auth:null,tab:"quiz",week:null,nextStart:null,mine:[],qIndex:null,busy:false,board:null,archives:null,review:null,error:null};

/* ---------- Accès à la base (fonctions Supabase) ---------- */
async function rpc(fn,args={}){
  const h={"Content-Type":"application/json",apikey:SUPABASE_KEY};
  if(!SUPABASE_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPABASE_KEY;
  let res;
  try{ res=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)}); }
  catch(e){ throw new Error("Pas de connexion. Vérifie ton réseau et réessaie."); }
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.message)||"Erreur du serveur.");
  if(data&&data.error) throw new Error(data.error);
  return data;
}
const cred=()=>({p_pseudo:S.auth.pseudo,p_pin:S.auth.pin});

/* ---------- Session mémorisée sur le téléphone ---------- */
function loadAuth(){ try{ return JSON.parse(localStorage.getItem("quiz-auth")); }catch(e){ return null; } }
function saveAuth(a){ try{ a?localStorage.setItem("quiz-auth",JSON.stringify(a)):localStorage.removeItem("quiz-auth"); }catch(e){} }

/* ---------- Utilitaires ---------- */
function fmt(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"}); }
function el(tag,attrs={},...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); } return e; }
function setTab(t){ S.tab=t; S.review=null; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t)); render(); window.scrollTo(0,0); if(t==="board") loadBoard(); if(t==="archive") loadArchives(); if(t==="forum") loadForum(); }
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

/* ---------- Accès organisateur ----------
   L'onglet Admin n'apparaît que sur l'appareil où le mot de passe administrateur a été saisi.
   Pour y accéder la première fois : toucher 5 fois de suite le titre « Quiz Épargne ». */
(function(){
  let admin=false; try{ admin=localStorage.getItem("quiz-admin-device")==="1"; }catch(e){}
  if(admin){
    document.querySelector("nav .tabs").style.gridTemplateColumns="repeat(5,1fr)";
    document.querySelector("nav .tabs").append(el("button",{role:"tab","aria-selected":"false",onclick:()=>{ location.href="admin.html"; }},
      (()=>{ const t=document.createElement("template"); t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>'; return t.content.firstChild; })(),"Admin"));
  }
  let taps=0, timer=null;
  document.querySelector(".brand").addEventListener("click",()=>{ taps++; clearTimeout(timer); timer=setTimeout(()=>taps=0,2500); if(taps>=5){ location.href="admin.html"; } });
})();

function render(){
  $view.replaceChildren();
  $who.replaceChildren();
  if(S.auth){ $who.append(el("div",{},S.auth.pseudo),el("button",{onclick:logout},"Changer de joueur")); }
  $nav.hidden=!S.auth;
  if(S.error){ $view.append(el("div",{class:"notice"},S.error),el("button",{class:"btn ghost",onclick:()=>{S.error=null;start();}},"Réessayer")); return; }
  if(!S.auth) return renderLogin();
  if(S.tab==="quiz") renderQuiz(); else if(S.tab==="board") renderBoard(); else if(S.tab==="forum") renderForum(); else renderArchive();
  updateDot();
}

/* ---------- Connexion ---------- */
function renderLogin(){
  const name=el("input",{id:"pseudo",type:"text",maxlength:"30",autocomplete:"username",placeholder:"Ex. Corentin"});
  const pin=el("input",{id:"pin",type:"password",inputmode:"numeric",pattern:"[0-9]*",maxlength:"4",autocomplete:"current-password",placeholder:"4 chiffres"});
  const err=el("p",{class:"error",role:"alert"});
  const btn=el("button",{class:"btn",type:"submit"},"Entrer");
  const form=el("form",{class:"card",onsubmit:async e=>{
    e.preventDefault(); err.textContent="";
    const p=name.value.trim(), c=pin.value.trim();
    if(p.length<2){ err.textContent="Indique ton prénom."; return; }
    if(!/^\d{4}$/.test(c)){ err.textContent="Le code doit contenir 4 chiffres."; return; }
    btn.disabled=true; btn.textContent="Connexion…";
    try{ const r=await rpc("join_quiz",{p_pseudo:p,p_pin:c}); S.auth={pseudo:r.pseudo,pin:c}; saveAuth(S.auth); await loadWeek(); loadBadges(); render(); }
    catch(x){ err.textContent=x.message; btn.disabled=false; btn.textContent="Entrer"; }
  }},
    el("h2",{},"Bienvenue dans le quiz"),
    el("p",{},"Chaque semaine, 5 questions sur l'épargne et les placements. Un point par bonne réponse, et un classement général en fin d'année."),
    el("div",{class:"field"},el("label",{for:"pseudo"},"Ton prénom"),name),
    el("div",{class:"field"},el("label",{for:"pin"},"Ton code secret"),pin),
    el("p",{class:"muted",style:"font-size:13px"},"Première fois ? Choisis un code à 4 chiffres et retiens-le : il te servira pour te reconnecter sur un autre appareil."),
    err,btn);
  $view.append(form);
}
function logout(){ S.badges=null; S.auth=null; saveAuth(null); S.mine=[]; S.qIndex=null; S.tab="quiz"; render(); }

/* ---------- Semaine en cours ---------- */
async function loadWeek(){
  S.week=await rpc("current_week");
  if(!S.week) S.nextStart=await rpc("next_week_start");
  S.mine=S.week? await rpc("my_week",{...cred(),p_week:S.week.id}) : [];
}
function renderQuiz(){
  const w=S.week;
  if(!w){ $view.append(el("div",{class:"card"},el("h2",{},"Pas de série ouverte"),el("p",{class:"muted"},S.nextStart?`Prochaine série le ${fmt(S.nextStart)}.`:"Les prochaines questions arrivent bientôt."))); return; }
  const n=w.questions.length, mine=S.mine, done=mine.length>=n;
  const card=el("div",{class:"card"},
    el("div",{class:"week-head"},el("div",{},el("h3",{},w.label),el("h2",{},w.theme)),el("span",{class:"pill"},`Jusqu'au ${fmt(w.end)}`)),
    el("div",{class:"dots"},w.questions.map((q,i)=>el("span",{class:i<mine.length?(mine[i].correct?"ok":"bad"):(i===mine.length&&!done?"cur":"")}))));
  if(done&&S.qIndex===null){
    const sc=mine.filter(m=>m.correct).length;
    card.append(el("div",{},el("p",{class:"muted"},"Ton score cette semaine"),el("div",{class:"score-big"},sc,el("span",{}," / "+n))),
      el("p",{},sc===n?"Sans faute. Bravo.":sc>=3?"Bon score. Les corrections détaillées sont dans les archives.":"Relis les corrections dans les archives : elles serviront pour la suite."),
      el("button",{class:"btn ghost",onclick:()=>{setTab("archive");openReview(w.id);}},"Voir les corrections"),
      el("button",{class:"btn",onclick:()=>setTab("board")},"Voir le classement"),
      el("p",{class:"muted",style:"font-size:13px;text-align:center"},`${w.finished} participant${w.finished>1?"s ont":" a"} terminé la série.`));
    $view.append(card); return;
  }
  const i=S.qIndex!==null?S.qIndex:mine.length, q=w.questions[i], a=mine[i];
  card.append(el("div",{class:"qnum"},el("span",{},`Question ${i+1} sur ${n}`),levelTag(i)),el("div",{class:"question"},q.q));
  card.append(el("div",{class:"choices"},q.choices.map((c,k)=>{
    let cls="choice"; if(a){ if(k===a.answer) cls+=" right"; else if(k===a.choice) cls+=" wrong"; }
    return el("button",{class:cls,disabled:!!a||S.busy,onclick:()=>answer(i,k)},el("span",{class:"k"},L[k]),el("span",{},c));
  })));
  if(a){
    card.append(el("div",{class:"explain"},el("b",{},a.correct?"Bonne réponse":"Mauvaise réponse"),a.explain));
    if(a.tip) card.append(el("div",{class:"tip"},el("b",{},"À retenir"),a.tip));
    const last=i===n-1;
    card.append(el("button",{class:"btn",onclick:async()=>{ if(last){ S.qIndex=null; try{ S.week=await rpc("current_week")||S.week; }catch(e){} } else S.qIndex=i+1; render(); }},last?"Voir mon score":"Question suivante"));
  }
  $view.append(card);
}
async function answer(i,k){
  if(S.busy) return; S.busy=true; render();
  try{ const r=await rpc("submit_answer",{...cred(),p_week:S.week.id,p_q:i,p_choice:k}); S.mine[i]=r; S.qIndex=i; loadBadges().then(()=>{}); }
  catch(e){ alert(e.message); }
  S.busy=false; render();
}

/* ---------- Classement ---------- */
async function loadBoard(){ try{ if(!S.prizes) S.prizes=await rpc("prizes_list").catch(()=>[]); S.board=await rpc("leaderboard"); }catch(e){ S.board={error:e.message}; } if(S.tab==="board") render(); }
function renderBoard(){
  if(!S.board){ $view.append(el("div",{class:"notice"},"Chargement du classement…")); return; }
  if(S.board.error){ $view.append(el("div",{class:"notice"},S.board.error)); return; }
  let rank=0,prev=null; const rows=S.board.map((r,i)=>{ if(r.points!==prev){rank=i+1;prev=r.points;} return {...r,rank}; });
  if(!rows.length){ $view.append(el("div",{class:"card"},el("h2",{},"Classement général"),el("p",{class:"muted"},"Personne n'a encore joué. Le premier qui répond prend la tête."))); renderPrizes(); return; }
  const me=S.auth.pseudo.toLowerCase(), top=rows.slice(0,3), order=[top[1],top[0],top[2]];
  $view.append(
    el("div",{class:"card"},el("h3",{},"Classement général "+new Date().getFullYear()),
      el("div",{class:"podium"},order.map((r,j)=>r?el("div",{class:"step s"+[2,1,3][j]},el("div",{class:"nm"},r.pseudo),el("div",{class:"block"},r.points)):el("div")))),
    el("div",{class:"card"},el("ol",{class:"board"},rows.map(r=>el("li",{class:"row"+(r.rank===1?" p1":"")+(r.pseudo.toLowerCase()===me?" mine":"")},
      el("div",{class:"rank"},r.rank),
      el("div",{style:"min-width:0"},el("div",{class:"name"},r.pseudo),el("div",{class:"sub"},`${r.weeks_played} semaine${r.weeks_played>1?"s jouées":" jouée"}`+(r.perfect?` · ${r.perfect} sans-faute`:"")+(r.badges?` · ${r.badges} badge${r.badges>1?"s":""}`:""))),
      el("div",{class:"pts"},r.points,el("small",{},"pts")))))));
  renderPrizes();
}
function renderPrizes(){
  const p=(S.prizes||[]).filter(x=>x&&x.label);
  if(!p.length) return;
  $view.append(el("div",{class:"card"},el("h3",{},"À gagner en fin d'année"),
    el("div",{class:"prizes"},p.map(x=>el("div",{class:"prize r"+x.rank},el("div",{class:"medal"},x.rank),el("span",{},x.label)))),
    el("p",{class:"muted",style:"font-size:13px"},"À égalité de points, le nombre de sans-faute départage, puis le nombre de semaines jouées.")));
}

/* ---------- Archives et corrections ---------- */
async function loadArchives(){ try{ await loadBadges(); S.archives=await rpc("archives",cred()); }catch(e){ S.archives={error:e.message}; } if(S.tab==="archive") render(); }
async function openReview(id){ S.review={loading:true}; render(); try{ S.review=await rpc("corrections",{...cred(),p_week:id}); }catch(e){ S.review={error:e.message}; } render(); }
function renderArchive(){
  if(S.review){
    const back=el("button",{class:"btn ghost",onclick:()=>{S.review=null;render();}},"← Toutes les semaines");
    if(S.review.loading){ $view.append(el("div",{class:"notice"},"Chargement…")); return; }
    if(S.review.error){ $view.append(el("div",{class:"card"},back,el("div",{class:"notice"},S.review.error))); return; }
    const r=S.review, card=el("div",{class:"card"},back,el("h3",{},r.label),el("h2",{},r.theme));
    r.items.forEach((it,i)=>{ const ok=it.choice===it.answer;
      card.append(el("div",{class:"review"},el("span",{class:"tag "+(it.choice==null?"":ok?"ok":"bad")},it.choice==null?"Non répondu":ok?"Juste":"Faux"),
        el("strong",{},`${i+1}. ${it.q}`),el("p",{},`Réponse : ${L[it.answer]}. ${it.choices[it.answer]}`),
        it.choice!=null&&!ok?el("p",{class:"muted"},`Ta réponse : ${L[it.choice]}. ${it.choices[it.choice]}`):null,
        el("p",{class:"muted"},it.explain),
        it.tip?el("div",{class:"tip"},el("b",{},"À retenir"),it.tip):null)); });
    $view.append(card); return;
  }
  renderBadges();
  if(!S.archives){ $view.append(el("div",{class:"notice"},"Chargement des archives…")); return; }
  if(S.archives.error){ $view.append(el("div",{class:"notice"},S.archives.error)); return; }
  if(!S.archives.length){ $view.append(el("div",{class:"notice"},"Aucune semaine pour l'instant.")); return; }
  $view.append(el("div",{class:"card"},el("h2",{},"Mes séries"),el("div",{},S.archives.map(w=>
    el("div",{class:"archive"},el("div",{style:"min-width:0"},el("strong",{},`${w.label} · ${w.theme}`),
      el("div",{class:"muted",style:"font-size:13px"},w.answered?`Ton score : ${w.score} / ${w.total}`:"Pas joué")),
      el("button",{onclick:()=>openReview(w.id)},"Corrections"))))));
}

/* ---------- Niveau de difficulté ---------- */
const LEVELS=["Facile","Facile","Intermédiaire","Difficile","Expert"];
function levelTag(i){ return el("span",{class:"level"},LEVELS[i]||"",el("i",{},[0,1,2,3,4].map(k=>el("b",{class:k<=i?"on":""})))); }

/* ---------- Espace questions ---------- */
function readSeen(){ try{ return +localStorage.getItem("quiz-forum-seen")||0; }catch(e){ return 0; } }
function writeSeen(n){ try{ localStorage.setItem("quiz-forum-seen",String(n)); }catch(e){} }
let forumTotal=0;
async function checkForum(){ try{ forumTotal=await rpc("forum_count"); updateDot(); }catch(e){} }
function updateDot(){ const b=document.querySelector('nav button[data-tab="forum"]'); if(!b) return; const old=b.querySelector(".dot"); if(old) old.remove(); if(S.tab!=="forum"&&forumTotal>readSeen()) b.append(el("span",{class:"dot","aria-label":"nouvelles réponses"})); }
async function loadForum(){ try{ S.forum=await rpc("list_questions",cred()); forumTotal=S.forum.filter(f=>f.answer).length; writeSeen(Math.max(forumTotal,readSeen())); }catch(e){ S.forum={error:e.message}; } if(S.tab==="forum") render(); }
function when(ts){ return new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}); }
function renderForum(){
  const box=el("textarea",{id:"ask",maxlength:"800",placeholder:"Ex. Un client peut-il avoir un LEP et un Livret A en même temps ?"});
  const err=el("p",{class:"error",role:"alert"});
  const btn=el("button",{class:"btn",type:"submit"},"Envoyer ma question");
  $view.append(el("form",{class:"card ask",onsubmit:async e=>{ e.preventDefault(); err.textContent="";
      if(box.value.trim().length<10){ err.textContent="Ta question est trop courte."; return; }
      btn.disabled=true;
      try{ await rpc("ask_question",{...cred(),p_body:box.value,p_anonymous:false}); box.value=""; await loadForum(); loadBadges(); }
      catch(x){ err.textContent=x.message; btn.disabled=false; } }},
    el("h2",{},"Une question ?"),
    el("p",{class:"muted"},"Sur un placement, un cas client, une notion du quiz… Ta question et sa réponse seront publiées ici, avec ton prénom, pour que tout le monde en profite."),
    box, err, btn));
  if(!S.forum){ $view.append(el("div",{class:"notice"},"Chargement des questions…")); return; }
  if(S.forum.error){ $view.append(el("div",{class:"notice"},S.forum.error)); return; }
  if(!S.forum.length){ $view.append(el("div",{class:"notice"},"Aucune question pour l'instant. Pose la première !")); return; }
  $view.append(el("div",{class:"card"},el("h3",{},"Questions et réponses"),el("div",{},S.forum.map(f=>el("div",{class:"thread"},
    el("div",{class:"meta"},(f.mine?"Toi":(f.author||"Un collègue"))+" · "+when(f.created_at)),
    el("div",{class:"q"},f.body),
    f.answer?el("div",{class:"a"},el("b",{},"Réponse"),f.answer):el("div",{class:"pending"},"En attente de réponse"))))));
}

/* ---------- Badges ---------- */
const ICONS={
 coin:'<circle cx="12" cy="12" r="8"/><path d="M14.5 9.2A3.5 3.5 0 1 0 14.5 14.8M8 11h5M8 13h5"/>',
 sprout:'<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/>',
 calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/>',
 pie:'<path d="M12 3v9h9A9 9 0 1 1 12 3z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',
 flame:'<path d="M12 21c-4 0-6-2.7-6-6 0-4 3-6 4-9 1 2 2 3 3 3 0-2 1-4 2-5 1 3 3 5 3 9 0 4.5-2.5 8-6 8z"/>',
 chart:'<path d="M4 20h16M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
 brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
 scroll:'<path d="M7 4h11v13a3 3 0 0 1-3 3H6a3 3 0 0 1 0-6h1zM10 8h5M10 11h5"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'
};
function icon(name){ const t=document.createElement("template"); t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.star)+'</svg>'; return t.content.firstChild; }
const unlocked=b=>b.progress>=b.target;
async function loadBadges(){ try{ const list=await rpc("my_badges",cred()); const before=S.badges; S.badges=list;
    if(before){ const old=new Set(before.filter(unlocked).map(b=>b.id)); const fresh=list.filter(b=>unlocked(b)&&!old.has(b.id)); if(fresh.length) toast(fresh[0]); }
  }catch(e){} }
function toast(b){ const t=el("div",{class:"toast",role:"status"},el("div",{class:"medal"},icon(b.icon)),el("div",{},el("b",{},"Badge débloqué"),b.name));
  document.body.append(t); setTimeout(()=>t.remove(),4500); }
function renderBadges(){
  const list=S.badges; if(!list) return;
  const n=list.filter(unlocked).length;
  const grid=el("div",{class:"badges"},list.map(b=>{ const on=unlocked(b);
    return el("button",{class:`bdg t${b.tier}${on?"":" locked"}`,"aria-label":`${b.name}${on?", débloqué":", verrouillé"}`,onclick:()=>{S.badgeOpen=S.badgeOpen===b.id?null:b.id;render();}},
      el("div",{class:"medal"},icon(b.icon)),el("div",{class:"nm"},b.name),
      on?null:el("div",{class:"pg"},el("i",{style:`width:${Math.round(100*b.progress/b.target)}%`}))); }));
  const open=list.find(b=>b.id===S.badgeOpen);
  $view.append(el("div",{class:"card"},el("div",{class:"week-head"},el("h2",{},"Mes badges"),el("span",{class:"pill"},`${n} / ${list.length}`)),
    open?el("div",{class:"bdg-detail"},el("strong",{},open.name),el("p",{},open.desc+(unlocked(open)?" : débloqué.":` (${open.progress} / ${open.target}).`))):el("p",{class:"muted",style:"font-size:13px"},"Touche un badge pour voir comment le débloquer."),
    grid));
}

/* ---------- Démarrage ---------- */
async function start(){
  if(SUPABASE_URL.includes("VOTRE-PROJET")){ S.error="L'appli n'est pas encore reliée à sa base de données : renseigne SUPABASE_URL et SUPABASE_KEY en haut du fichier."; render(); return; }
  S.auth=loadAuth();
  checkForum();
  if(S.auth){ try{ await loadWeek(); loadBadges(); }catch(e){ if(/Code|Prénom|essais/.test(e.message)){ S.auth=null; saveAuth(null); } else S.error=e.message; } }
  render();
}
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible"&&S.auth&&!S.busy&&S.qIndex===null){ try{ await loadWeek(); render(); }catch(e){} } });
start();
</script>
